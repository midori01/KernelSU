name: Build KowSU and xx LKMs
on:
  workflow_call:
    inputs:
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
  workflow_dispatch:
jobs:
  build:
    name: Build LKMs for ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      EXPECTED_SIZE: ${{ inputs.expected_size }}
      EXPECTED_HASH: ${{ inputs.expected_hash }}
      KMI: ${{ matrix.kmi }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Prepare sources
      id: prep
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        echo "KSU_VERSION=$(expr 30999 + $(git rev-list --count HEAD))" >> $GITHUB_OUTPUT
        cp -r .github/xx-lkm /tmp/xx-lkm
        git fetch origin +refs/heads/xx:refs/remotes/origin/xx
        [ "$(git log -1 --format=%s origin/xx~1)" = extra ] || { echo "xx~1 is not the extra commit"; exit 1; }
        [ "$(git log -1 --format=%s origin/xx~2)" = lkm ] || { echo "xx~2 is not the lkm commit"; exit 1; }
        mkdir -p /github/workspace/out/aarch64

    - name: Build KowSU
      run: |
        cd kernel
        EXTRA_ARGS=""
        [ -n "$PACKAGE_NAME" ] && EXTRA_ARGS="$EXTRA_ARGS KSU_PACKAGE_NAME=$PACKAGE_NAME"
        [ -n "$EXPECTED_SIZE" ] && EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
        [ -n "$EXPECTED_HASH" ] && EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_HASH=$EXPECTED_HASH"
        [ "${{ github.event_name }}" = "pull_request" ] && EXTRA_ARGS="$EXTRA_ARGS KSU_IS_PR_BUILD=1"
        CONFIG_KSU=m CC=clang make $EXTRA_ARGS
        cp kernelsu.ko "/github/workspace/out/aarch64/${KMI}_kernelsu.ko"

    - name: Build xxKSU
      run: |
        git clean -fdxq kernel && git checkout -qf --detach origin/xx~1
        bash /tmp/xx-lkm/apply-sct-sync.sh /tmp/xx-lkm/midori_sct_sync.h
        sed -i "s/CFLAGS_ksu.o += -DKSU_VERSION=.*/CFLAGS_ksu.o += -DKSU_VERSION=${{ steps.prep.outputs.KSU_VERSION }}/" kernel/Makefile
        cd kernel
        CONFIG_KSU=m CC=clang make \
          KSU_PACKAGE_NAME="${PACKAGE_NAME:-com.kowx712.supermanager}" \
          KSU_EXPECTED_SIZE="${EXPECTED_SIZE:-0x375}" \
          KSU_EXPECTED_HASH="${EXPECTED_HASH:-484fcba6e6c43b1fb09700633bf2fb4758f13cb0b2f4457b80d075084b26c588}"
        cp kernelsu.ko "/github/workspace/out/xx-${KMI}_kernelsu.ko"

    - name: Strip
      run: |
        cd /github/workspace/out
        llvm-strip -d aarch64/*.ko *.ko
        ls -la aarch64/*.ko *.ko

    - name: Upload KowSU artifact
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ matrix.kmi }}-lkm
        path: /github/workspace/out/aarch64/${{ matrix.kmi }}_kernelsu.ko

    - name: Upload xxKSU artifact
      uses: actions/upload-artifact@v7
      with:
        name: xx-${{ matrix.kmi }}-lkm
        path: /github/workspace/out/xx-${{ matrix.kmi }}_kernelsu.ko

